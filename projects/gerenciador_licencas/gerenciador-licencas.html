<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerenciador de Licenças — Weknow</title>
<style>
:root{
  /* ---------- TEMA: cor primária (marca e interação) ----------
     Para trocar a identidade do sistema, altere apenas estes 4 valores.
     Verde original: #16a34a / #15803d / #166534 / #dcfce7             */
  --primary:#3366cc; --primary-600:#2a56ad; --primary-700:#22468c; --primary-50:#e9effb;
  --primary-ring:rgba(51,102,204,.14);

  /* ---------- Cores semânticas (não mudam com o tema) ---------- */
  --green:#16a34a; --green-600:#15803d; --green-700:#166534; --green-50:#dcfce7;
  --blue-50:#dbeafe; --blue-700:#1d4ed8;
  --cyan-50:#e2f6f9; --cyan-700:#0e7490;   /* ciano do símbolo Weknow */
  --red:#dc2626; --red-50:#fee2e2; --red-700:#b91c1c;
  --amber-50:#ffedd5; --amber-700:#c2410c;
  --slate-900:#1e293b; --slate-700:#334155; --slate-600:#475569; --slate-500:#64748b;
  --slate-400:#94a3b8; --slate-300:#cbd5e1; --slate-200:#e2e8f0; --slate-100:#f1f5f9; --slate-50:#f8fafc;
  --border:#e5e7eb;
  --radius:8px; --radius-lg:12px;
  --shadow-sm:0 1px 2px rgba(15,23,42,.06);
  --shadow-lg:0 18px 48px rgba(15,23,42,.18);
  --font:"Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:#fff;color:var(--slate-700);font-size:14px;line-height:1.45}
a{color:var(--primary-600);text-decoration:none}
button{font-family:inherit}

/* ---------- TOPBAR ---------- */
.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:8px;height:58px;padding:0 24px;background:#fff;border-bottom:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:10px;font-size:17px;font-weight:700;color:var(--slate-900);margin-right:18px;white-space:nowrap;cursor:pointer}
.brand svg{width:26px;height:26px;flex:none;display:block}
.brand b{font-weight:700;color:var(--primary)}
.nav{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.navitem{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:var(--radius);color:var(--slate-600);font-size:14px;background:none;border:0;cursor:pointer;white-space:nowrap}
.navitem:hover{background:var(--slate-100);color:var(--slate-900)}
.navitem.active{background:var(--primary-50);color:var(--primary-700);font-weight:600}
.topicons{display:flex;align-items:center;gap:10px;color:var(--slate-500)}
.topicons button{background:none;border:0;cursor:pointer;color:var(--slate-500);display:flex;align-items:center;gap:6px;padding:7px;border-radius:6px;font-size:13.5px}
.topicons button:hover{background:var(--slate-100);color:var(--slate-700)}
.topicons svg{width:18px;height:18px}
.dropdown{position:relative}
.dropdown-menu{position:absolute;top:calc(100% + 6px);left:0;min-width:260px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:6px;display:none;z-index:80}
.dropdown-menu.open{display:block}
.dropdown-menu a{display:block;padding:9px 12px;border-radius:6px;color:var(--slate-700);font-size:13.5px}
.dropdown-menu a:hover{background:var(--slate-100)}
.dropdown-menu a.on{background:var(--primary-50);color:var(--primary-700);font-weight:600}

/* ---------- LAYOUT ---------- */
.page{max-width:1500px;margin:0 auto;padding:34px 32px 80px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
h1{font-size:26px;font-weight:700;color:var(--slate-900);margin:0}
h2{font-size:18px;font-weight:700;color:var(--slate-900);margin:0}
h3{font-size:14px;font-weight:700;color:var(--slate-900);margin:0}
.subtitle{margin:6px 0 0;color:var(--slate-500);font-size:13.5px}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--slate-400);margin-bottom:10px;flex-wrap:wrap}
.breadcrumb a{color:var(--slate-500);cursor:pointer}
.breadcrumb a:hover{color:var(--primary-600)}

/* ---------- BUTTONS ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:var(--radius);border:1px solid transparent;font-size:14px;font-weight:600;cursor:pointer;background:#fff;color:var(--slate-700);white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:var(--primary-600)}
.btn-ghost{border-color:var(--border);color:var(--slate-600)}
.btn-ghost:hover{background:var(--slate-50);color:var(--slate-900)}
.btn-danger{background:#fff;border-color:#fecaca;color:var(--red)}
.btn-danger:hover{background:var(--red-50)}
.btn-danger-solid{background:var(--red);color:#fff}
.btn-danger-solid:hover{background:#b91c1c}
.btn-sm{height:32px;padding:0 12px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:0;background:none;border-radius:6px;cursor:pointer;color:var(--primary)}
.icon-btn:hover{background:var(--primary-50)}
.icon-btn.danger{color:var(--red)}
.icon-btn.danger:hover{background:var(--red-50)}
.icon-btn.muted{color:var(--slate-400)}
.icon-btn.muted:hover{background:var(--slate-100);color:var(--slate-600)}
.icon-btn svg{width:17px;height:17px}
.rowactions{display:flex;align-items:center;justify-content:flex-end;gap:2px}

/* ---------- FORM CONTROLS ---------- */
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:18px}
.input{height:40px;padding:0 12px;border:1px solid var(--slate-200);border-radius:var(--radius);background:#fff;font-size:14px;color:var(--slate-700);outline:none;font-family:inherit;width:100%}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:1.5}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-ring)}
.input::placeholder{color:var(--slate-400)}
select.input{appearance:none;background-image:url(data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAyNCAyNCIgZmlsbD0ibm9uZSIgc3Ryb2tlPSIjOTRhM2I4IiBzdHJva2Utd2lkdGg9IjIiPjxwYXRoIGQ9Ik02IDlsNiA2IDYtNiIvPjwvc3ZnPg==);background-repeat:no-repeat;background-position:right 10px center;background-size:16px;padding-right:32px}
.search{position:relative}
.search .input{padding-left:34px;min-width:250px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--slate-400)}
.w-160{width:160px;flex:none}.w-180{width:180px;flex:none}.w-200{width:200px;flex:none}.w-240{width:240px;flex:none}
.field{display:flex;flex-direction:column;gap:6px}
.field > label{font-size:12.5px;font-weight:600;color:var(--slate-600)}
.field .hint{font-size:12px;color:var(--slate-400)}
.req{color:var(--red)}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.span2{grid-column:span 2}
@media(max-width:1100px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.g2,.g3,.g4{grid-template-columns:1fr}.span2{grid-column:auto}}

.segmented{display:inline-flex;background:var(--slate-100);border-radius:var(--radius);padding:3px;gap:3px}
.segmented button{border:0;background:none;padding:7px 16px;border-radius:6px;font-size:13.5px;color:var(--slate-500);cursor:pointer;font-weight:500}
.segmented button.on{background:#fff;color:var(--slate-900);font-weight:700;box-shadow:var(--shadow-sm)}

.switch{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer;user-select:none}
.switch .track{width:38px;height:21px;border-radius:999px;background:var(--slate-300);position:relative;transition:background .15s;flex:none}
.switch .track::after{content:"";position:absolute;top:2.5px;left:2.5px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:var(--shadow-sm)}
.switch.on .track{background:var(--primary)}
.switch.on .track::after{left:19.5px}
.switch span{font-size:13.5px;color:var(--slate-600)}
.switch.on span{color:var(--slate-900)}
.radio{display:flex;align-items:center;gap:10px;padding:5px 0;cursor:pointer;font-size:13.5px;color:var(--slate-600)}
.radio i{width:18px;height:18px;border-radius:50%;border:2px solid var(--slate-300);display:inline-block;flex:none;position:relative}
.radio.on i{border-color:var(--primary)}
.radio.on i::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--primary)}
.check{display:flex;align-items:flex-start;gap:9px;padding:6px 4px;cursor:pointer;border-radius:6px}
.check:hover{background:var(--slate-50)}
.check i{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--slate-300);flex:none;margin-top:2px;position:relative;background:#fff}
.check.on i{background:var(--primary);border-color:var(--primary)}
.check.on i::after{content:"";position:absolute;left:4.5px;top:1px;width:4px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(42deg)}

.box{border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;background:#fff;position:relative}
.box > .box-title{position:absolute;top:-9px;left:14px;background:#fff;padding:0 8px;font-size:12px;font-weight:600;color:var(--slate-500)}
.card{border:1px solid var(--border);border-radius:var(--radius-lg);background:#fff;box-shadow:var(--shadow-sm)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-body{padding:20px}

/* ---------- TABLE ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:880px}
th{text-align:left;font-size:13px;font-weight:700;color:var(--slate-900);padding:12px 14px;border-bottom:1px solid var(--border);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:var(--primary-700)}
th .arrow{font-size:10px;color:var(--slate-400);margin-left:4px}
td{padding:14px;border-bottom:1px solid var(--slate-100);font-size:13.5px;color:var(--slate-600);vertical-align:middle}
tbody tr:hover{background:var(--slate-50)}
td.strong{color:var(--slate-900);font-weight:600}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.cell-sub{display:block;color:var(--slate-400);font-size:12.5px;margin-top:3px}
.linkcell{color:var(--primary-600);font-weight:600;cursor:pointer}
.linkcell:hover{text-decoration:underline}

/* ---------- BADGES ---------- */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.6;white-space:nowrap}
.b-green{background:var(--green-50);color:var(--green-700)}
.b-red{background:var(--red-50);color:var(--red-700)}
.b-blue{background:var(--blue-50);color:var(--blue-700)}
/* chip de dado de referência: ciano da marca Weknow (#5ADBDB), fora das cores semânticas */
.b-ref{background:var(--cyan-50);color:var(--cyan-700)}
/* ambiente: marcador com a cor definida no cadastro */
.amb{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--slate-700);white-space:nowrap}
.amb i{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 2px rgba(15,23,42,.07)}
.amb.sm{font-size:12.5px;font-weight:500;color:var(--slate-500)}
.cor-picker{display:flex;align-items:center;gap:10px}
.cor-picker input[type=color]{width:52px;height:40px;padding:3px;border:1px solid var(--slate-200);border-radius:var(--radius);background:#fff;cursor:pointer}
.cor-presets{display:flex;gap:6px;flex-wrap:wrap}
.cor-presets button{width:26px;height:26px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--slate-200);cursor:pointer;padding:0}
.cor-presets button.on{box-shadow:0 0 0 2px var(--primary)}
.b-amber{background:var(--amber-50);color:var(--amber-700)}
.b-gray{background:var(--slate-100);color:var(--slate-500)}
.b-violet{background:#ede9fe;color:#6d28d9}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

/* ---------- PAGINATION ---------- */
.pagination{display:flex;align-items:center;justify-content:center;gap:6px;padding:20px 0 4px}
.pagination button{min-width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--slate-500);cursor:pointer;font-size:13.5px;display:inline-flex;align-items:center;justify-content:center}
.pagination button:hover:not(:disabled){background:var(--slate-100)}
.pagination button.on{background:var(--primary-50);color:var(--primary-700);font-weight:700}
.pagination button:disabled{opacity:.35;cursor:not-allowed}
.pag-info{text-align:center;font-size:12.5px;color:var(--slate-400)}

/* ---------- EMPTY ---------- */
.empty{padding:56px 20px;text-align:center;color:var(--slate-400)}
.empty svg{width:44px;height:44px;color:var(--slate-300);margin-bottom:12px}
.empty h3{color:var(--slate-600);margin-bottom:6px}
.empty p{margin:0 0 16px;font-size:13.5px}

/* ---------- MODAL ---------- */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;overflow-y:auto}
.modal{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:520px;padding:26px;margin:auto}
.modal.md{max-width:680px}.modal.lg{max-width:880px}
.modal h2{margin-bottom:20px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
.modal-icon{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:14px}
.modal-icon svg{width:22px;height:22px}

/* ---------- TOAST ---------- */
.toasts{position:fixed;right:22px;bottom:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1px solid var(--border);border-left:4px solid var(--green);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:13px 16px;min-width:300px;max-width:400px;animation:slide .2s ease}
.toast.err{border-left-color:var(--red)}
.toast strong{display:block;color:var(--slate-900);font-size:13.5px}
.toast p{margin:2px 0 0;font-size:12.5px;color:var(--slate-500)}
@keyframes slide{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- DASHBOARD ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px;background:#fff;box-shadow:var(--shadow-sm)}
.stat .lbl{font-size:12.5px;color:var(--slate-500);display:flex;align-items:center;gap:8px}
.stat .val{font-size:30px;font-weight:700;color:var(--slate-900);margin-top:8px;line-height:1}
.stat .sub{font-size:12px;color:var(--slate-400);margin-top:6px}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.bar-row .name{width:170px;font-size:13px;color:var(--slate-600);flex:none}
.bar-track{flex:1;height:9px;border-radius:999px;background:var(--slate-100);overflow:hidden}
.bar-fill{height:100%;border-radius:999px;background:var(--primary)}
.bar-row .qty{width:38px;text-align:right;font-size:13px;font-weight:700;color:var(--slate-900);flex:none}

/* ---------- 360 ---------- */
.hero{border:1px solid var(--border);border-radius:var(--radius-lg);background:#fff;box-shadow:var(--shadow-sm);padding:22px 24px;margin-bottom:20px}
.hero-top{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hero .lic{font-size:12px;color:var(--slate-400);letter-spacing:.06em;font-weight:700;text-transform:uppercase}
.hero .num{font-size:24px;font-weight:700;color:var(--slate-900);display:flex;align-items:center;gap:12px;margin:4px 0 6px;flex-wrap:wrap}
.hero .cli{color:var(--slate-500);font-size:14px}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap}
.hero-meta{display:grid;grid-template-columns:repeat(5,1fr);gap:18px;margin-top:22px;padding-top:20px;border-top:1px solid var(--slate-100)}
@media(max-width:1000px){.hero-meta{grid-template-columns:repeat(2,1fr)}}
.meta .k{font-size:11.5px;color:var(--slate-400);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.meta .v{font-size:15px;color:var(--slate-900);font-weight:600;margin-top:5px}
.alert{display:flex;align-items:flex-start;gap:10px;border-radius:var(--radius);padding:12px 14px;font-size:13px;margin-top:16px}
.alert svg{width:17px;height:17px;flex:none;margin-top:1px}
.alert-warn{background:#fffbeb;color:#92400e;border:1px solid #fde68a}
.alert-danger{background:var(--red-50);color:var(--red-700);border:1px solid #fecaca}
.alert-info{background:#eff6ff;color:var(--blue-700);border:1px solid #bfdbfe}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:22px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 16px;font-size:14px;color:var(--slate-500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button:hover{color:var(--slate-900)}
.tabs button.on{color:var(--primary-700);border-bottom-color:var(--primary);font-weight:700}
.dl{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 24px}
@media(max-width:760px){.dl{grid-template-columns:1fr}}
.dl .k{font-size:12px;color:var(--slate-400);font-weight:600}
.dl .v{font-size:14px;color:var(--slate-900);margin-top:3px}
.two-col{display:grid;grid-template-columns:1fr 380px;gap:20px;align-items:start}
@media(max-width:1100px){.two-col{grid-template-columns:1fr}}

.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:var(--slate-100)}
.tl-item{position:relative;padding-bottom:22px}
.tl-item::before{content:"";position:absolute;left:-23px;top:4px;width:12px;height:12px;border-radius:50%;background:#fff;border:2px solid var(--primary)}
.tl-item.gray::before{border-color:var(--slate-300)}
.tl-item .when{font-size:12px;color:var(--slate-400)}
.tl-item .what{font-size:13.5px;color:var(--slate-900);font-weight:600;margin:3px 0}
.tl-item .who{font-size:12.5px;color:var(--slate-500)}
.tl-item .diff{margin-top:8px;background:var(--slate-50);border:1px solid var(--border);border-radius:6px;padding:9px 12px;font-size:12.5px;color:var(--slate-600)}
.tl-item .diff s{color:var(--slate-400)}

.transfer{display:grid;grid-template-columns:1fr 54px 1fr;gap:14px;align-items:center}
@media(max-width:860px){.transfer{grid-template-columns:1fr}}
.tr-list{border:1px solid var(--border);border-radius:var(--radius);height:250px;overflow-y:auto;background:#fff}
.tr-head{display:flex;align-items:center;justify-content:space-between;padding:8px 4px;font-weight:700;color:var(--slate-900);font-size:13.5px}
.tr-mid{display:flex;flex-direction:column;gap:10px;align-items:center}
.tr-mid button{width:42px;height:34px;border-radius:6px;border:0;background:var(--primary-50);color:var(--primary-700);cursor:pointer;font-size:15px;font-weight:700}
.tr-mid button:hover{background:var(--primary);color:#fff}
.tr-item{padding:9px 11px;border-bottom:1px solid var(--slate-100);cursor:pointer}
.tr-item:hover{background:var(--slate-50)}
.tr-item .t{font-size:13px;color:var(--slate-900);font-weight:600}
.tr-item .s{font-size:11.5px;color:var(--slate-400);margin-top:2px}

.upload{border:2px dashed var(--slate-200);border-radius:var(--radius-lg);padding:22px;text-align:center;background:var(--slate-50);cursor:pointer}
.upload:hover{border-color:var(--primary);background:var(--primary-50)}
.upload svg{width:26px;height:26px;color:var(--slate-400);margin-bottom:6px}
.upload p{margin:0;font-size:13px;color:var(--slate-500)}
.preview{border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.preview .ph{height:130px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px;text-align:center;padding:10px}
.preview .bar{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;border-top:1px solid var(--border);font-size:12px;color:var(--slate-500)}

.steps{display:flex;align-items:center;margin-bottom:26px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:9px;padding-right:14px}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--slate-100);color:var(--slate-400);font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.step .t{font-size:13px;color:var(--slate-400)}
.step.on .n{background:var(--primary);color:#fff}
.step.on .t{color:var(--slate-900);font-weight:700}
.step.done .n{background:var(--primary-50);color:var(--primary-700)}
.step.done .t{color:var(--slate-600)}
.step-line{width:26px;height:2px;background:var(--slate-200);margin-right:14px}
.form-footer{display:flex;justify-content:flex-end;gap:10px;padding-top:22px;margin-top:24px;border-top:1px solid var(--border)}
.section-title{font-size:13px;font-weight:700;color:var(--slate-900);text-transform:uppercase;letter-spacing:.04em;margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--slate-100)}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--slate-50);border:1px solid var(--border);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--slate-700)}
.chip button{border:0;background:none;color:var(--slate-400);cursor:pointer;font-size:15px;line-height:1;padding:0}
.chip button:hover{color:var(--red)}
.list-inline{display:flex;flex-wrap:wrap;gap:8px}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}.mb8{margin-bottom:8px}.mb16{margin-bottom:16px}.mb20{margin-bottom:20px}
.muted{color:var(--slate-400)}
.right{text-align:right}
.flex{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* ---------- v12: limites, ilimitado, exclusão lógica, prévia ---------- */
.span3{grid-column:span 3}
@media(max-width:1100px){.span3{grid-column:span 2}}
@media(max-width:760px){.span3{grid-column:auto}}
.switch span small{display:block;font-size:11.5px;color:var(--slate-400);font-weight:400;margin-top:1px}
.limite{display:flex;align-items:center;gap:14px}
.limite > .input{flex:1}
.limite .switch{padding:0;flex:none}
.limite-ilim{flex:1;display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border:1px dashed var(--slate-200);border-radius:var(--radius);background:var(--slate-50);color:#6d28d9;font-weight:600;font-size:13.5px}
.limite-ilim svg{width:18px;height:18px}
.check.inline{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);height:40px;background:#fff}
.check.inline i{margin-top:0}
.check.inline.on{border-color:var(--primary);background:var(--primary-50)}
tr.row-excluido{opacity:.55}
tr.row-excluido td:first-child::after{content:" · excluído";color:var(--red);font-size:11.5px;font-weight:600}
.previa{margin:0;padding:12px 14px;background:var(--slate-50);border:1px solid var(--border);border-radius:var(--radius);font-family:Consolas,"Courier New",monospace;font-size:12px;color:var(--slate-600);overflow-x:auto;white-space:pre;line-height:1.7}
.lista-eventos{margin:8px 0 0;padding-left:18px;font-size:13px;color:var(--slate-600)}
.lista-eventos li{margin-bottom:5px}

/* ---------- v12: barra empilhada e métricas do dashboard ---------- */
.stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--slate-100)}
.stack div{height:100%}
.stack-legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 18px;margin-top:18px}
.stack-legend .item{display:flex;align-items:center;gap:9px;font-size:13px}
.stack-legend .sw{width:11px;height:11px;border-radius:3px;flex:none}
.stack-legend .nm{color:var(--slate-600);flex:1}
.stack-legend .qt{font-weight:700;color:var(--slate-900);font-variant-numeric:tabular-nums}
.stack-legend .pc{color:var(--slate-400);font-size:12px;width:38px;text-align:right;font-variant-numeric:tabular-nums}
.gauge{display:flex;align-items:center;gap:18px}
.gauge .ring{width:96px;height:96px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative}
.gauge .ring span{font-size:23px;font-weight:700;color:var(--slate-900)}
.gauge .ring::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
.gauge .ring span{position:relative;z-index:1}
.mini-metric{display:flex;justify-content:space-between;align-items:baseline;padding:9px 0;border-bottom:1px solid var(--slate-100);font-size:13px}
.mini-metric:last-child{border-bottom:0}
.mini-metric .k{color:var(--slate-500)}
.mini-metric .v{font-weight:700;color:var(--slate-900);font-variant-numeric:tabular-nums}
.barra-uso{height:6px;border-radius:999px;background:var(--slate-100);overflow:hidden;margin-top:6px}
.barra-uso div{height:100%;background:var(--primary);border-radius:999px}
.kpi-link{background:none;border:0;padding:0;color:var(--primary-600);font-weight:600;font-size:12.5px;cursor:pointer}
.kpi-link:hover{text-decoration:underline}
</style>

/* Chave gerada pelo sistema, no formato WK-XXXX-XXXX-XXXX-XXXX */
function chaveLic(seed){
  const alfa = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let x = ((seed+1)*2654435761)>>>0 || 1, s = '';
  for(let i=0;i<16;i++){
    x ^= x<<13; x>>>=0; x ^= x>>>17; x ^= x<<5; x>>>=0;
    s += alfa[x % alfa.length];
    if(i%4===3 && i<15) s += '-';
  }
  return 'WK-'+s;
}

/* ---------- Situação e limites ---------- */
/* Regra 8: status, data de vencimento e motivo de bloqueio são separados.
   A situação efetiva combina a situação registrada com a vigência. */
function situacao(l){
  if(l.situacao==='Bloqueada') return {key:'bloqueada', label:'Bloqueada', cls:'b-red'};
  if(l.situacao==='Inativa')   return {key:'inativa',   label:'Inativa',   cls:'b-gray'};
  if(l.situacao==='Expirada')  return {key:'expirada',  label:'Expirada',  cls:'b-red'};
  const d = diasAte(l.expiracao);
  if(d < -TOLERANCIA_DIAS) return {key:'expirada',  label:'Expirada',  cls:'b-red'};
  if(d < 0)                return {key:'tolerancia',label:'Em tolerância', cls:'b-amber'};
  if(d <= 30)              return {key:'aexpirar',  label:'A expirar', cls:'b-amber'};
  return {key:'vigente', label:'Ativa', cls:'b-green'};
}
const SITUACOES_EFETIVAS = [
  {v:'vigente',    t:'Ativa (vigente)'},
  {v:'aexpirar',   t:'A expirar (30 dias)'},
  {v:'tolerancia', t:'Em tolerância'},
  {v:'expirada',   t:'Expirada'},
  {v:'bloqueada',  t:'Bloqueada'},
  {v:'inativa',    t:'Inativa'}
];
function situacaoBadgeCls(s){
  return {Ativa:'b-green', Inativa:'b-gray', Expirada:'b-red', Bloqueada:'b-red'}[s] || 'b-gray';
}
function statusLiberacaoCls(s){
  return {Ativa:'b-green', Agendada:'b-blue', Expirada:'b-gray', Cancelada:'b-gray', Restaurada:'b-violet'}[s] || 'b-gray';
}

}
function limiteInstalacoes(l){

}

/* ---------- Seção 8: rotinas automáticas (idempotentes) ---------- */
function rodarRotinas(origem){
  const eventos = [];
  const orig = origem || 'Rotina automática';

  // 1. licenças vencidas além da tolerância
  DB.licencas.forEach(l=>{
    if(l.situacao==='Ativa' && diasAte(l.expiracao) < -TOLERANCIA_DIAS){
      l.situacao='Expirada'; l.motivoId=6;
      eventos.push('Licença '+l.identificador+' expirada (vencida há '+Math.abs(diasAte(l.expiracao))+' dias).');
      log({entidade:'Licença', entidadeId:l.id, rotulo:l.identificador, tipo:'Expiração',
           rotuloEvento:'Licença expirada automaticamente', de:'Ativa', para:'Expirada',
           origem:orig, usuario:'Rotina de expiração', obs:'Tolerância de '+TOLERANCIA_DIAS+' dias aplicada.'});
    }
  });

  // 2. instalações temporárias vencidas
  DB.instalacoes.forEach(i=>{
    if(i.ativo && i.temporaria && i.termino && diasAte(i.termino) < 0){
      i.ativo=false;
      eventos.push('Instalação temporária '+i.identificador+' encerrada.');
      log({entidade:'Instalação', entidadeId:i.id, rotulo:i.identificador, tipo:'Ativação/Desativação',
           rotuloEvento:'Instalação temporária encerrada automaticamente', de:'Ativa', para:'Inativa',
           origem:orig, usuario:'Rotina de expiração'});
    }
  });

  // 3. liberações temporárias vencidas → restaura configuração original (regra 12)
  DB.liberacoes.forEach(x=>{
    if(x.status==='Ativa' && diasAte(x.termino) < 0){
      x.status='Restaurada';
      const l = get('licencas', x.licencaId);
      const rec = x.recurso==='usuarios' ? 'usuários' : 'instalações';
      eventos.push('Liberação de '+rec+' da licença '+l.identificador+' restaurada para '+x.valorOriginal+'.');
      log({entidade:'Liberação temporária', entidadeId:x.id, rotulo:(x.recurso==='usuarios'?'Usuários':'Instalações')+' — '+l.identificador,
           tipo:'Restauração', rotuloEvento:'Configuração original restaurada',
           de:(x.ilimitado?'Ilimitado':x.valorNovo)+' '+rec, para:x.valorOriginal+' '+rec,
           origem:orig, usuario:'Rotina de restauração'});
    }
    // liberações agendadas que chegaram à data de início
    if(x.status==='Agendada' && x.aprovadoEm && diasAte(x.inicio) <= 0 && diasAte(x.termino) >= 0){
      x.status='Ativa';
      const l = get('licencas', x.licencaId);
      eventos.push('Liberação temporária da licença '+l.identificador+' ativada.');
      log({entidade:'Liberação temporária', entidadeId:x.id, rotulo:(x.recurso==='usuarios'?'Usuários':'Instalações')+' — '+l.identificador,
           tipo:'Liberação temporária', rotuloEvento:'Liberação temporária ativada',
           de:String(x.valorOriginal), para:(x.ilimitado?'Ilimitado':String(x.valorNovo)), origem:orig, usuario:'Rotina de ativação'});
    }
  });

  return eventos;
}

/* ---------- foco preservado entre re-renderizações ---------- */
function preserveFocus(mutate){
  const ae = document.activeElement;
  const fk = ae && ae.getAttribute ? ae.getAttribute('data-f') : null;
  let pos = null; try{ pos = ae ? ae.selectionStart : null; }catch(e){}
  mutate();
  if(fk){
    const el = document.querySelector('[data-f="'+fk+'"]');
    if(el){ el.focus(); try{ el.setSelectionRange(pos,pos); }catch(e){} }
  }
}

/* ---------- listagem genérica ---------- */
function listState(key){
  if(!S.lists[key]) S.lists[key] = { q:'', page:1, sort:null, dir:1, f:{} };
  return S.lists[key];
}
function setList(key, prop, val){ const st=listState(key); st[prop]=val; if(prop!=='page') st.page=1; render(); }
function setListF(key, prop, val){ const st=listState(key); st.f[prop]=val; st.page=1; render(); }

function clearList(key){ S.lists[key] = { q:'', page:1, sort:null, dir:1, f:{} }; render(); }
function sortList(key, col){
  const st = listState(key);
  if(st.sort===col) st.dir = -st.dir; else { st.sort=col; st.dir=1; }
  render();
}

function dataTable(cfg){
  const st = listState(cfg.key);
  let rows = cfg.rows.slice();
  if(st.sort){
    const col = cfg.columns.find(c=>c.key===st.sort);
    if(col && col.sortVal) rows.sort((a,b)=>{
      const x=col.sortVal(a), y=col.sortVal(b);
      return (x>y?1:x<y?-1:0)*st.dir;
    });
  }
  const per = cfg.perPage||10;
  const pages = Math.max(1, Math.ceil(rows.length/per));
  if(st.page>pages) st.page=pages;
  const view = rows.slice((st.page-1)*per, st.page*per);

  if(!rows.length){
    return '<div class="card"><div class="empty">'+IC.inbox+
      '<h3>'+esc(cfg.emptyTitle || (cfg.hasFilters?'Nenhum resultado encontrado':'Nenhum registro cadastrado'))+'</h3>'+
      '<p>'+esc(cfg.emptyMsg || (cfg.hasFilters?'Ajuste a busca ou os filtros para tentar novamente.':'Cadastre o primeiro registro para começar.'))+'</p>'+
      (cfg.hasFilters?'<button class="btn btn-ghost" onclick="clearList(\''+cfg.key+'\')">Limpar filtros</button>':(cfg.emptyAction||''))+
      '</div></div>';
  }

  const th = cfg.columns.map(c=>{
    const cls = [c.sortVal?'sortable':'', c.align?'right':''].filter(Boolean).join(' ');
    const arrow = st.sort===c.key ? '<span class="arrow">'+(st.dir>0?'▲':'▼')+'</span>' : '';
    return '<th'+(c.width?' style="width:'+c.width+'"':'')+(cls?' class="'+cls+'"':'')+
      (c.sortVal?' onclick="sortList(\''+cfg.key+'\',\''+c.key+'\')"':'')+'>'+esc(c.label)+arrow+'</th>';
  }).join('');

  const tb = view.map(r=>'<tr'+(r.excluido?' class="row-excluido"':'')+'>'+
    cfg.columns.map(c=>'<td class="'+(c.cls||'')+'">'+c.render(r)+'</td>').join('')+'</tr>').join('');

  return '<div class="card">'+
    (cfg.toolbar?'<div class="card-head">'+cfg.toolbar+'</div>':'')+
    '<div class="table-wrap"><table><thead><tr>'+th+'</tr></thead><tbody>'+tb+'</tbody></table></div>'+
    pagination(cfg.key, st.page, pages, rows.length, per)+'</div>';
}
function pagination(key, page, pages, total, per){
  const btn = (label, target, dis, on) =>
    '<button '+(dis?'disabled':'onclick="setList(\''+key+'\',\'page\','+target+')"')+(on?' class="on"':'')+'>'+label+'</button>';
  let nums = '';
  const from = Math.max(1, Math.min(page-2, pages-4)), to = Math.min(pages, Math.max(page+2,5));
  for(let i=from;i<=to;i++) nums += btn(i, i, false, i===page);
  return '<div style="padding:6px 0 16px">'+
    '<div class="pagination">'+btn('&laquo;',1,page===1)+btn('&lsaquo;',page-1,page===1)+nums+
    btn('&rsaquo;',page+1,page===pages)+btn('&raquo;',pages,page===pages)+'</div>'+
    '<div class="pag-info">Exibindo '+((page-1)*per+1)+'–'+Math.min(page*per,total)+' de '+total+' registro(s)</div></div>';
}

const ENTIDADES = {
  tiposParceiro:{rotulo:'Tipo de Parceiro Comercial', nome:r=>r.descricao, entidade:'Tipo de Parceiro'},
  parceiros:    {rotulo:'Parceiro Comercial',        nome:r=>r.nome,      entidade:'Parceiro Comercial'},
  clientes:     {rotulo:'Cliente',                   nome:r=>r.razaoSocial, entidade:'Cliente'},
  produtos:     {rotulo:'Produto',                   nome:r=>r.nome,      entidade:'Produto'},
  tiposLicenca: {rotulo:'Tipo de Licença',           nome:r=>r.sigla,     entidade:'Tipo de Licença'},
  categorias:   {rotulo:'Categoria de Licença',      nome:r=>r.descricao, entidade:'Categoria de Licença'},
  ambientes:    {rotulo:'Ambiente',                  nome:r=>r.sigla+' — '+r.descricao, entidade:'Ambiente'},
  brandings:    {rotulo:'Branding',                  nome:r=>r.descricao, entidade:'Branding'},
  motivos:      {rotulo:'Motivo de Alteração',       nome:r=>r.descricao, entidade:'Motivo de Alteração'}
};
function pedirSituacao(col, id){
  const meta=ENTIDADES[col], r=get(col,id), nome=meta.nome(r);
  if(r.ativo) return confirmDialog({ tom:'warn', title:'Inativar '+meta.rotulo.toLowerCase()+'?',
    message:'<b>'+esc(nome)+'</b> deixará de aparecer para novas associações. Os registros já vinculados '+
            '<b>não são alterados</b> — conforme a regra de inativação.',
    confirmLabel:'Inativar', onConfirm:'aplicarSituacao(\''+col+'\','+id+')' });
  aplicarSituacao(col, id);
}
function aplicarSituacao(col, id){
  const meta=ENTIDADES[col], r=get(col,id), antes=r.ativo?'Ativo':'Inativo';
  r.ativo = !r.ativo;
  log({entidade:meta.entidade, entidadeId:id, rotulo:meta.nome(r), tipo:'Ativação/Desativação',
       rotuloEvento:r.ativo?'Registro reativado':'Registro inativado', de:antes, para:r.ativo?'Ativo':'Inativo'});
  closeModal(); render();
  toast(r.ativo?'Registro reativado':'Registro inativado', meta.nome(r));
}
function pedirExclusao(col, id, vinculos){
  const meta=ENTIDADES[col], r=get(col,id), nome=meta.nome(r);
  const usos = vinculos||[];
  if(usos.length) return confirmDialog({ tom:'warn', title:'Exclusão não permitida',
    message:'<b>'+esc(nome)+'</b> está em uso: '+usos.map(u=>'<b>'+u+'</b>').join(', ')+'.<br><br>'+
            'Registros utilizados em licenças, instalações ou histórico não podem ser removidos. Use a <b>inativação</b> para impedir novas associações.',
    confirmLabel:'Inativar em vez disso', onConfirm:'closeModal();pedirSituacao(\''+col+'\','+id+')' });
  confirmDialog({ title:'Confirmar exclusão lógica?',
    message:'<b>'+esc(nome)+'</b> será marcado como excluído e sai das listagens, mas o registro é <b>preservado</b> para rastreabilidade e continua visível no histórico.',
    confirmLabel:'Excluir logicamente', onConfirm:'aplicarExclusao(\''+col+'\','+id+')' });
}
function aplicarExclusao(col, id){
  const meta=ENTIDADES[col], r=get(col,id);
  r.excluido = true; r.ativo = false;
  log({entidade:meta.entidade, entidadeId:id, rotulo:meta.nome(r), tipo:'Exclusão lógica',
       rotuloEvento:'Registro excluído logicamente', de:'Ativo', para:'Excluído'});
  closeModal(); render();
  toast('Exclusão lógica aplicada', meta.nome(r)+' foi preservado no histórico.');
}
function restaurarRegistro(col, id){
  const meta=ENTIDADES[col], r=get(col,id);
  r.excluido = false;
  log({entidade:meta.entidade, entidadeId:id, rotulo:meta.nome(r), tipo:'Exclusão lógica',
       rotuloEvento:'Exclusão lógica revertida', de:'Excluído', para:'Inativo'});
  render(); toast('Registro restaurado', meta.nome(r)+' voltou para a listagem como inativo.');
}

/* ---------- exportação (seção 10) ---------- */
function csvEscape(v){
  const s = String(v==null?'':v);
  return /[";\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function exportar(nome, colunas, linhas, filtros){
  const cab = colunas.map(c=>csvEscape(c.label)).join(';');
  const corpo = linhas.map(r=>colunas.map(c=>csvEscape(c.valor(r))).join(';'));
  const csv = '﻿'+[cab].concat(corpo).join('\r\n');
  const previa = [cab].concat(corpo.slice(0,6)).join('\n');
  S.csv = {nome, csv};
  openModal('<h2>Exportar '+esc(nome)+'</h2>'+
    '<p class="muted" style="margin:0 0 16px;font-size:13px">'+linhas.length+' registro(s) · separador ponto e vírgula · UTF-8 com BOM (abre direto no Excel)</p>'+
    (filtros&&filtros.length
      ? '<div class="box mb16"><div class="box-title">Filtros aplicados</div><div class="list-inline">'+
        filtros.map(f=>badge(f,'b-blue')).join('')+'</div></div>'
      : '<div class="alert alert-info mb16" style="margin-top:0">'+IC.info+'<div>Nenhum filtro aplicado — a exportação inclui todos os registros da consulta.</div></div>')+
    '<div class="field"><label>Prévia</label><pre class="previa">'+esc(previa)+(corpo.length>6?'\n… mais '+(corpo.length-6)+' linha(s)':'')+'</pre></div>'+
    '<div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">Fechar</button>'+
    '<button class="btn btn-ghost" onclick="copiarCSV()">Copiar CSV</button>'+
    '<button class="btn btn-primary" onclick="baixarCSV()">'+IC.download+'Baixar CSV</button></div>','md');
}
/* alternativa ao download — funciona também onde o navegador bloqueia salvar arquivo */
function copiarCSV(){
  const csv = (S.csv||{}).csv;
  if(!csv) return;
  const fallback = ()=>{
    const ta=document.createElement('textarea');
    ta.value=csv; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
    ta.remove();
    if(ok){ closeModal(); toast('CSV copiado','Cole em uma planilha ou editor de texto.'); }
    else toast('Não foi possível copiar','Selecione o conteúdo da prévia manualmente.',true);
  };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(csv)
      .then(()=>{ closeModal(); toast('CSV copiado','Cole em uma planilha ou editor de texto.'); })
      .catch(fallback);
  } else fallback();
}
function baixarCSV(){
  const {nome, csv} = S.csv||{};
  if(!csv) return;
  const arquivo = 'weknow-'+norm(nome).replace(/[^a-z0-9]+/g,'-')+'-'+hojeISO()+'.csv';
  try{
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = arquivo;
    document.body.appendChild(a); a.click(); a.remove();
    toast('Exportação gerada', arquivo);
  }catch(e){
    toast('Download bloqueado', 'O navegador impediu o download neste contexto.', true);
  }
  closeModal();
}

  if(S.openMenu===k) return fecharMenu();
  const r = botao.getBoundingClientRect();
  const largura = 260;
  S.openMenu = k;
  S.menuPos = {
    left: Math.round(Math.min(r.left, window.innerWidth - largura - 12)),
    top: Math.round(r.bottom + 6)
  };
  render();
}

    const pos = aberto && S.menuPos ? ' style="position:fixed;left:'+S.menuPos.left+'px;top:'+S.menuPos.top+'px"' : '';
    return '<div class="dropdown">'+
      '<button class="navitem'+(ativo?' active':'')+'" onclick="event.stopPropagation();abrirMenu(\''+m.k+'\',this)">'+esc(m.t)+seta+'</button>'+
      '<div class="dropdown-menu'+(aberto?' open':'')+'"'+pos+'>'+

/* ---------- router ---------- */
function parseRoute(){
  const h = S.route || location.hash || '#/dashboard';
  return h.replace(/^#\/?/,'').split('/').filter(Boolean);
}
function render(){
  const parts = parseRoute();
  const key = parts[0] || 'dashboard';
  const view = VIEWS[key] || VIEWS['404'];
  const rota = S.route || location.hash;
  const routeChanged = S.rendered !== rota;
  const scroll = window.scrollY;
  S.rendered = rota;

  preserveFocus(()=>{ $('#app').innerHTML = shell(view(parts), key); });

  if(routeChanged) window.scrollTo(0,0); else window.scrollTo(0, scroll);
}
window.addEventListener('hashchange', ()=>{
  if(location.hash && location.hash!==S.route){ S.route=location.hash; S.openMenu=null; closeModal(); render(); }
});
document.addEventListener('click', ()=>{ if(S.openMenu) fecharMenu(); });
window.addEventListener('resize', ()=>{ if(S.openMenu) fecharMenu(); });

/* lista filtrada por busca + situação + excluídos */
function baseLista(col, key, casaBusca){
  const st = listState(key), q = norm(st.q);
  return DB[col].filter(r=>{
    if(!st.f.excl && r.excluido) return false;
    if(q && !casaBusca(r,q)) return false;
    if(st.f.sit==='ativos'   && !r.ativo) return false;
    if(st.f.sit==='inativos' &&  r.ativo) return false;
    return true;
  });
}

function saveParceiro(id){
  const f=S.form.parceiro;

    ativo:!!f.ativo, contatos:f.contatos.filter(c=>c.nome||c.email)};

    log({entidade:'Parceiro Comercial', entidadeId:id, rotulo:data.nome, tipo:'Alteração', rotuloEvento:'Cadastro alterado'}); }
  else { novoId=nextId('parceiros'); DB.parceiros.push(Object.assign({id:novoId}, data));

}

  const data={razaoSocial:f.razaoSocial,nomeFantasia:f.nomeFantasia,cnpj:f.cnpj,parceiroId:num(f.parceiroId),

    log({entidade:'Cliente', entidadeId:id, rotulo:data.razaoSocial, tipo:'Alteração', rotuloEvento:'Cadastro alterado'}); }
  else { novoId=nextId('clientes'); DB.clientes.push(Object.assign({id:novoId},data));

function filtrarLicencas(key){
  const st=listState(key), q=norm(st.q);
  return DB.licencas.filter(l=>{
    const c = clienteDe(l);
    if(q && !(norm(l.identificador).includes(q)||norm(l.chave).includes(q)||norm(c.razaoSocial).includes(q)||norm(c.nomeFantasia).includes(q))) return false;
    if(st.f.cliente   && String(l.clienteId)!==st.f.cliente) return false;
    if(st.f.produto   && !l.produtos.includes(Number(st.f.produto))) return false;
    if(st.f.tipo      && String(l.tipoLicencaId)!==st.f.tipo) return false;
    if(st.f.categoria && String(l.categoriaId)!==st.f.categoria) return false;
    if(st.f.sit       && situacao(l).key!==st.f.sit) return false;
    if(st.f.ambiente  && !instalacoesDe(l).some(i=>String(i.ambienteId)===st.f.ambiente)) return false;
    if(st.f.de  && l.expiracao < st.f.de) return false;
    if(st.f.ate && l.expiracao > st.f.ate) return false;
    return true;
  });
}
function rotulosFiltroLicenca(key){
  const st=listState(key), r=[];
  if(st.q) r.push('Busca: '+st.q);
  if(st.f.cliente)   r.push('Cliente: '+get('clientes',st.f.cliente).nomeFantasia);
  if(st.f.produto)   r.push('Produto: '+get('produtos',st.f.produto).nome);
  if(st.f.tipo)      r.push('Tipo: '+get('tiposLicenca',st.f.tipo).sigla);
  if(st.f.categoria) r.push('Categoria: '+get('categorias',st.f.categoria).descricao);
  if(st.f.ambiente)  r.push('Ambiente: '+get('ambientes',st.f.ambiente).descricao);
  if(st.f.sit)       r.push('Situação: '+(SITUACOES_EFETIVAS.find(x=>x.v===st.f.sit)||{}).t);
  if(st.f.de)        r.push('Expira após '+fmtDate(st.f.de));
  if(st.f.ate)       r.push('Expira antes de '+fmtDate(st.f.ate));
  return r;
}

const PASSOS = ['Cliente','Produtos','Tipo de Licença','Vigência e usuários','Emissão'];

function licencaNova(){
  const f = useForm('licenca','nova', ()=>({
    step:1, clienteId:S.novaLicClienteId||'', produtos:[], tipoLicencaId:'', categoriaId:1, brandingId:'',
    situacao:'Ativa', emissao:hojeISO(), inicio:hojeISO(), expiracao:'',
    qtdUsuarios:'', usuariosIlimitados:false, qtdInstalacoes:'', instalacoesIlimitadas:false,
    obs:'', busca:'', selDisp:[], selSel:[]
  }));
  const step = f.step;

  const steps = '<div class="steps">'+PASSOS.map((p,i)=>{
    const n=i+1, cls = n===step?'on':(n<step?'done':'');
    return (i?'<div class="step-line"></div>':'')+'<div class="step '+cls+'"><div class="n">'+(n<step?'✓':n)+'</div><div class="t">'+esc(p)+'</div></div>';
  }).join('')+'</div>';

  const body = [passoCliente, passoProdutos, passoTipo, passoVigencia, passoRevisao][step-1](f);
  const podeAvancar = validarPasso(f, step)===true;

  return pageHead('Nova Licença','Identificador e chave são gerados automaticamente na emissão.',
      '<button class="btn btn-ghost" onclick="go(\'#/licencas\')">'+IC.x+'Cancelar</button>',
      [{t:'Licenças',href:'#/licencas'},{t:'Nova Licença'}])+
    steps+'<div class="card"><div class="card-body">'+body+'</div></div>'+
    '<div class="form-footer">'+
      '<button class="btn btn-ghost" onclick="'+(step===1?'go(\'#/licencas\')':'setF(\'form.licenca.step\','+(step-1)+')')+'">'+(step===1?'Cancelar':'Voltar')+'</button>'+
      (step<5
        ? '<button class="btn btn-primary" '+(podeAvancar?'':'disabled')+' onclick="setF(\'form.licenca.step\','+(step+1)+')">Avançar'+IC.chev+'</button>'
        : '<button class="btn btn-primary" onclick="emitirLicenca()">'+IC.key+'Emitir Licença</button>')+
    '</div>';
}
function validarPasso(f, step){
  if(step===1) return f.clienteId?true:'Selecione o cliente.';
  if(step===2) return f.produtos.length?true:'Selecione ao menos um produto.';
  if(step===3) return (f.tipoLicencaId&&f.categoriaId)?true:'Selecione o tipo e a categoria da licença.';
  if(step===4){
    if(!f.inicio||!f.expiracao) return 'Informe a vigência.';
    if(f.expiracao<=f.inicio) return 'A data de expiração deve ser posterior à data de início.';
    if(!f.usuariosIlimitados && !num(f.qtdUsuarios)) return 'Informe a quantidade de usuários ou marque Ilimitado.';
    if(!f.instalacoesIlimitadas && !num(f.qtdInstalacoes)) return 'Informe a quantidade de instalações ou marque Ilimitado.';
    const t=get('tiposLicenca',f.tipoLicencaId);
    const dias=difDias(f.inicio,f.expiracao);
    if(t.duracaoMaxDias && dias>t.duracaoMaxDias) return 'A vigência ('+dias+' dias) excede a duração máxima do tipo '+t.sigla+' ('+t.duracaoMaxDias+' dias).';
    return true;
  }
  return true;
}

function emitirLicenca(){
  const f=S.form.licenca;
  for(let s=1;s<=4;s++){ const v=validarPasso(f,s); if(v!==true){ setF('form.licenca.step',s); return toast('Não foi possível emitir', v, true); } }
  const id = nextId('licencas');
  const ultimo = Math.max(0, ...DB.licencas.map(x=>Number(String(x.identificador).split('-').pop())||0));
  const identificador = 'LIC-2026-'+String(ultimo+1).padStart(4,'0');
  const cli = get('clientes', f.clienteId);
  DB.licencas.unshift({
    id, identificador, chave:chaveLic(id*7+13), clienteId:num(f.clienteId), produtos:f.produtos.slice(),
    tipoLicencaId:num(f.tipoLicencaId), categoriaId:num(f.categoriaId), brandingId:num(f.brandingId)||cli.brandingId||null,
    qtdUsuarios:num(f.qtdUsuarios), usuariosIlimitados:!!f.usuariosIlimitados,
    qtdInstalacoes:num(f.qtdInstalacoes), instalacoesIlimitadas:!!f.instalacoesIlimitadas,
    emissao:f.emissao, inicio:f.inicio, expiracao:f.expiracao, situacao:f.situacao, motivoId:null,
    obs:f.obs, renovacoes:[]
  });
  log({entidade:'Licença', entidadeId:id, rotulo:identificador, tipo:'Emissão', rotuloEvento:'Licença emitida',
       para:identificador, obs:'Cliente: '+cli.razaoSocial});
  S.form.licenca=null; S.novaLicClienteId=null;
  go('#/licencas/'+id);
  toast('Licença emitida', identificador+' criada com sucesso.');
}

function salvarEdicaoLicenca(id){
  const l=get('licencas',id), f=S.form.licEdit;
  if(!f.produtos.length) return toast('Não foi possível salvar','Selecione ao menos um produto.',true);
  if(f.expiracao<=f.inicio) return toast('Não foi possível salvar','A data de expiração deve ser posterior à de início.',true);
  const antes = fmtLimite(limiteUsuarios(l))+' usuário(s), '+produtosDe(l).length+' produto(s)';
  Object.assign(l,{produtos:f.produtos.slice(), tipoLicencaId:num(f.tipoLicencaId), categoriaId:num(f.categoriaId),
    brandingId:num(f.brandingId)||null, qtdUsuarios:num(f.qtdUsuarios), usuariosIlimitados:!!f.usuariosIlimitados,
    qtdInstalacoes:num(f.qtdInstalacoes), instalacoesIlimitadas:!!f.instalacoesIlimitadas,
    inicio:f.inicio, expiracao:f.expiracao, obs:f.obs});
  const depois = fmtLimite(limiteUsuarios(l))+' usuário(s), '+f.produtos.length+' produto(s)';
  log({entidade:'Licença', entidadeId:id, rotulo:l.identificador, tipo:'Alteração', rotuloEvento:'Dados da licença alterados', de:antes, para:depois});
  S.form.licEdit=null; go('#/licencas/'+id); toast('Licença atualizada', l.identificador+' foi alterada.');
}

function confirmarAlteracaoStatus(){
  const f=S.form.status, l=get('licencas',f.id), m=get('motivos',f.motivoId);

  l.motivoId=['Bloqueada','Inativa','Expirada'].includes(f.nova)?m.id:null;
  log({entidade:'Licença', entidadeId:l.id, rotulo:l.identificador, tipo:'Alteração de status',
       rotuloEvento:'Situação alterada', de:antes, para:f.nova, obs:m.descricao+(f.obs?' — '+f.obs:'')});
  closeModal(); S.form.status=null; render();
  toast('Situação alterada', l.identificador+': '+antes+' → '+f.nova+'.');
}

function openRenovar(id){
  const l=get('licencas',id), t=tipoLicDe(l);
  const novoInicio = diasAte(l.expiracao)<0 ? hojeISO() : addDias(l.expiracao,1);
  const dur = Math.min(t.duracaoMaxDias, 365);
  S.form.renov = {id, etapa:'form', inicio:novoInicio, expiracao:addDias(novoInicio, dur), tipoLicencaId:l.tipoLicencaId, obs:''};
  renderRenovar();
}

  setModalRender(renderRenovar);

    : (f.expiracao<=f.inicio) ? 'A nova expiração deve ser posterior ao início.'
    : (dias>t.duracaoMaxDias) ? 'A vigência ('+dias+' dias) excede a duração máxima do tipo '+t.sigla+' ('+t.duracaoMaxDias+' dias).' : null;

        '<div><div class="k">Duração</div><div class="v">'+dias+' dias</div></div>'+
        '<div class="span2"><div class="k">Observações</div><div class="v">'+esc(f.obs||'—')+'</div></div>'+
      '</div>'+
      '<div class="alert alert-info mt20">'+IC.info+'<div>A renovação preserva a vigência anterior no histórico e reativa a licença se estiver expirada.</div></div>'+
      '<div class="modal-actions"><button class="btn btn-ghost" onclick="setF(\'form.renov.etapa\',\'form\')">Voltar</button>'+

  openModal('<h2>Renovar licença</h2>'+
    '<div class="box mb20"><div class="box-title">Dados atuais</div>'+
      '<div class="dl">'+
        '<div><div class="k">Identificador</div><div class="v">'+esc(l.identificador)+'</div></div>'+

function confirmarRenovacao(){
  const f=S.form.renov, l=get('licencas',f.id);

  l.renovacoes.unshift({data:hojeISO(), deInicio, deFim, paraInicio:f.inicio, paraFim:f.expiracao, usuario:USUARIO_ATUAL, obs:f.obs});
  l.inicio=f.inicio; l.expiracao=f.expiracao; l.tipoLicencaId=num(f.tipoLicencaId);

       de:fmtDate(deInicio)+' – '+fmtDate(deFim), para:fmtDate(f.inicio)+' – '+fmtDate(f.expiracao), obs:f.obs});

function filtrarInstalacoes(key){
  const st=listState(key), q=norm(st.q);
  return DB.instalacoes.filter(i=>{
    const l=get('licencas',i.licencaId), c=clienteDe(l);
    if(q && !(norm(i.descricao).includes(q)||norm(i.identificador).includes(q)||norm(i.finalidade).includes(q)||
              norm(l.identificador).includes(q)||norm(c.nomeFantasia).includes(q))) return false;
    if(st.f.ambiente && String(i.ambienteId)!==st.f.ambiente) return false;
    if(st.f.cliente  && String(l.clienteId)!==st.f.cliente) return false;
    if(st.f.licenca  && String(i.licencaId)!==st.f.licenca) return false;
    if(st.f.tipo==='temporarias' && !i.temporaria) return false;
    if(st.f.tipo==='permanentes' &&  i.temporaria) return false;
    if(st.f.sit==='ativos'   && !i.ativo) return false;
    if(st.f.sit==='inativos' &&  i.ativo) return false;
    return true;
  });
}
function rotulosFiltroInstalacao(key){
  const st=listState(key), r=[];
  if(st.q) r.push('Busca: '+st.q);
  if(st.f.ambiente) r.push('Ambiente: '+get('ambientes',st.f.ambiente).descricao);
  if(st.f.cliente)  r.push('Cliente: '+get('clientes',st.f.cliente).nomeFantasia);
  if(st.f.licenca)  r.push('Licença: '+get('licencas',st.f.licenca).identificador);
  if(st.f.tipo)     r.push(st.f.tipo==='temporarias'?'Somente temporárias':'Somente permanentes');
  if(st.f.sit)      r.push(st.f.sit==='ativos'?'Ativas':'Inativas');
  return r;
}

function saveInstalacao(){
  const f=S.form.inst;
  const miss=missing(f,[{k:'licencaId',t:'Licença'},{k:'descricao',t:'Descrição'},{k:'ambienteId',t:'Ambiente'},
    {k:'finalidade',t:'Finalidade'},{k:'identificador',t:'Identificador técnico'},{k:'inicio',t:'Data de início'}]);
  if(miss.length) return failValidation(miss);
  if(f.temporaria && !f.termino) return failValidation(['Data de término (instalação temporária)']);
  if(f.termino && f.termino<=f.inicio) return toast('Datas inválidas','O término deve ser posterior ao início.',true);

  const data={licencaId:num(f.licencaId), descricao:f.descricao, ambienteId:num(f.ambienteId), finalidade:f.finalidade,
    identificador:f.identificador, inicio:f.inicio, termino:f.termino||null, brandingId:num(f.brandingId)||null,
    temporaria:!!f.temporaria, ativo:!!f.ativo, obs:f.obs};
  const l=get('licencas',data.licencaId);
  if(f.id){ Object.assign(get('instalacoes',f.id), data);
    log({entidade:'Instalação', entidadeId:f.id, rotulo:data.identificador, tipo:'Alteração', rotuloEvento:'Instalação alterada',
         obs:'Licença '+l.identificador}); }
  else { const id=nextId('instalacoes'); DB.instalacoes.push(Object.assign({id},data));
    log({entidade:'Instalação', entidadeId:id, rotulo:data.identificador, tipo:'Cadastro',
         rotuloEvento:data.temporaria?'Instalação temporária registrada':'Instalação registrada',
         obs:'Licença '+l.identificador+' · ambiente '+get('ambientes',data.ambienteId).descricao}); }
  closeModal(); render(); toast('Instalação salva', data.descricao);
}

       rotuloEvento:i.ativo?'Instalação ativada':'Instalação inativada', de:antes, para:i.ativo?'Ativa':'Inativa'});

function filtrarLiberacoes(key){
  const st=listState(key), q=norm(st.q);
  return DB.liberacoes.filter(x=>{
    const l=get('licencas',x.licencaId), c=clienteDe(l);
    if(q && !(norm(x.motivo).includes(q)||norm(l.identificador).includes(q)||norm(c.nomeFantasia).includes(q))) return false;
    if(st.f.recurso && x.recurso!==st.f.recurso) return false;
    if(st.f.status  && x.status!==st.f.status) return false;
    if(st.f.licenca && String(x.licencaId)!==st.f.licenca) return false;
    return true;
  });
}
function rotulosFiltroLiberacao(key){
  const st=listState(key), r=[];
  if(st.q) r.push('Busca: '+st.q);
  if(st.f.recurso) r.push('Recurso: '+(st.f.recurso==='usuarios'?'Usuários':'Instalações'));
  if(st.f.status)  r.push('Status: '+st.f.status);
  if(st.f.licenca) r.push('Licença: '+get('licencas',st.f.licenca).identificador);
  return r;
}

function saveLiberacao(){
  const f=S.form.lib;
  const miss=missing(f,[{k:'licencaId',t:'Licença'},{k:'inicio',t:'Data de início'},{k:'termino',t:'Data de término'},{k:'motivo',t:'Motivo'}]);
  if(miss.length) return failValidation(miss);
  if(!f.ilimitado && !num(f.valorNovo)) return failValidation(['Novo valor']);
  if(f.termino<=f.inicio) return toast('Datas inválidas','O término deve ser posterior ao início.',true);

  const lic=get('licencas',f.licencaId);
  const limite = f.recurso==='usuarios'?limiteUsuarios(lic):limiteInstalacoes(lic);
  if(!f.ilimitado && !limite.ilimitado && num(f.valorNovo)<=limite.valor)
    return toast('Valor sem efeito','O novo valor deve ser maior que o atual ('+limite.valor+').',true);

  const data={licencaId:num(f.licencaId), recurso:f.recurso, valorOriginal:limite.ilimitado?0:limite.valor,
    valorNovo:num(f.valorNovo), ilimitado:!!f.ilimitado, inicio:f.inicio, termino:f.termino, motivo:f.motivo,
    usuario:f.usuario, status:'Agendada', aprovadoPor:null, aprovadoEm:null};
  const rotulo=(data.recurso==='usuarios'?'Usuários':'Instalações')+' — '+lic.identificador;
  if(f.id){ Object.assign(get('liberacoes',f.id), data);
    log({entidade:'Liberação temporária', entidadeId:f.id, rotulo, tipo:'Alteração', rotuloEvento:'Liberação alterada'}); }
  else { const id=nextId('liberacoes'); DB.liberacoes.push(Object.assign({id},data));
    log({entidade:'Liberação temporária', entidadeId:id, rotulo, tipo:'Liberação temporária', rotuloEvento:'Liberação temporária solicitada',
         de:String(data.valorOriginal), para:data.ilimitado?'Ilimitado':String(data.valorNovo), obs:data.motivo}); }
  closeModal(); render(); toast('Liberação registrada','Aguardando aprovação.');
}
function aprovarLiberacao(id){
  const x=get('liberacoes',id), l=get('licencas',x.licencaId);
  const rotulo=(x.recurso==='usuarios'?'Usuários':'Instalações')+' — '+l.identificador;
  confirmDialog({tom:'info', title:'Aprovar liberação temporária?',
    message:'A licença <b>'+esc(l.identificador)+'</b> passa de <b>'+x.valorOriginal+'</b> para <b>'+(x.ilimitado?'ilimitado':x.valorNovo)+'</b> '+
      (x.recurso==='usuarios'?'usuário(s)':'instalação(ões)')+' entre '+fmtDate(x.inicio)+' e '+fmtDate(x.termino)+'.',
    confirmLabel:'Aprovar', onConfirm:'aplicarAprovacao('+id+')'});
}
function aplicarAprovacao(id){
  const x=get('liberacoes',id), l=get('licencas',x.licencaId);
  x.aprovadoPor=USUARIO_ATUAL; x.aprovadoEm=hojeISO();
  const dentroPeriodo = diasAte(x.inicio)<=0 && diasAte(x.termino)>=0;
  x.status = dentroPeriodo ? 'Ativa' : 'Agendada';
  const rotulo=(x.recurso==='usuarios'?'Usuários':'Instalações')+' — '+l.identificador;
  log({entidade:'Liberação temporária', entidadeId:id, rotulo, tipo:'Liberação temporária',
       rotuloEvento:dentroPeriodo?'Liberação aprovada e ativada':'Liberação aprovada (agendada)',
       de:String(x.valorOriginal), para:x.ilimitado?'Ilimitado':String(x.valorNovo), obs:x.motivo});
  closeModal(); render();
  toast('Liberação aprovada', dentroPeriodo?'Já está ativa.':'Entra em vigor em '+fmtDate(x.inicio)+'.');
}
function cancelarLiberacao(id){
  const x=get('liberacoes',id), l=get('licencas',x.licencaId);
  confirmDialog({title:'Cancelar liberação temporária?',
    message:'A liberação da licença <b>'+esc(l.identificador)+'</b> será cancelada e o limite volta ao valor original ('+x.valorOriginal+'). O registro é preservado.',
    confirmLabel:'Cancelar liberação', onConfirm:'aplicarCancelamentoLib('+id+')'});

function aplicarCancelamentoLib(id){
  const x=get('liberacoes',id), l=get('licencas',x.licencaId), antes=x.status;
  x.status='Cancelada';
  log({entidade:'Liberação temporária', entidadeId:id, rotulo:(x.recurso==='usuarios'?'Usuários':'Instalações')+' — '+l.identificador,
       tipo:'Liberação temporária', rotuloEvento:'Liberação cancelada', de:antes, para:'Cancelada'});
  closeModal(); render(); toast('Liberação cancelada','O limite original foi mantido.');
}
function restaurarLiberacao(id){
  const x=get('liberacoes',id), l=get('licencas',x.licencaId);
  const rec = x.recurso==='usuarios'?'usuários':'instalações';
  x.status='Restaurada';
  log({entidade:'Liberação temporária', entidadeId:id, rotulo:(x.recurso==='usuarios'?'Usuários':'Instalações')+' — '+l.identificador,
       tipo:'Restauração', rotuloEvento:'Configuração original restaurada',
       de:(x.ilimitado?'Ilimitado':x.valorNovo)+' '+rec, para:x.valorOriginal+' '+rec});
  render(); toast('Configuração restaurada','Limite de '+rec+' voltou para '+x.valorOriginal+'.');

function filtrarAuditoria(key){
  const st=listState(key), q=norm(st.f.busca||st.q||'');
  return DB.auditoria.filter(a=>{
    if(q && !(norm(a.rotulo).includes(q)||norm(a.rotuloEvento||'').includes(q)||norm(a.usuario).includes(q)||norm(a.obs||'').includes(q))) return false;
    if(st.f.entidade && a.entidade!==st.f.entidade) return false;
    if(st.f.tipo     && a.tipo!==st.f.tipo) return false;
    if(st.f.origem   && a.origem!==st.f.origem) return false;
    if(st.f.usuario  && a.usuario!==st.f.usuario) return false;
    return true;
  });
}
function rotulosFiltroAuditoria(key){
  const st=listState(key), r=[];
  if(st.q||st.f.busca) r.push('Busca: '+(st.f.busca||st.q));
  if(st.f.entidade) r.push('Entidade: '+st.f.entidade);
  if(st.f.tipo)     r.push('Tipo: '+st.f.tipo);
  if(st.f.origem)   r.push('Origem: '+st.f.origem);
  if(st.f.usuario)  r.push('Usuário: '+st.f.usuario);
  return r;
}

  const panorama =
    '<div class="stats mb20">'+
      '<div class="stat"><div class="lbl">'+badgeDot('Licenças ativas','b-green')+'</div><div class="val">'+saudaveis+'</div>'+
        '<div class="sub">de '+total+' licenças cadastradas</div></div>'+
      '<div class="stat"><div class="lbl">'+badgeDot('Exigem atenção','b-amber')+'</div><div class="val">'+atencao.length+'</div>'+
        '<div class="sub">a expirar, vencidas ou bloqueadas</div></div>'+
      '<div class="stat"><div class="lbl">'+badgeDot('Instalações ativas','b-blue')+'</div><div class="val">'+DB.instalacoes.filter(i=>i.ativo).length+'</div>'+
        '<div class="sub">'+DB.instalacoes.filter(i=>i.ativo&&i.temporaria).length+' temporária(s) em uso</div></div>'+
      '<div class="stat"><div class="lbl">'+badgeDot('Liberações vigentes','b-violet')+'</div><div class="val">'+DB.liberacoes.filter(x=>x.status==='Ativa').length+'</div>'+
        '<div class="sub">'+DB.liberacoes.filter(x=>x.status==='Agendada').length+' agendada(s)</div></div>'+
    '</div>';

  /* --- saúde da carteira + distribuição empilhada --- */
  const segmentos = SITUACOES_EFETIVAS.filter(s=>porSit[s.v].length)
    .map(s=>({key:s.v, nome:s.t, n:porSit[s.v].length, cor:CORES_SITUACAO[s.v]}));
  const stack = '<div class="stack">'+segmentos.map(s=>
      '<div style="width:'+(s.n/total*100)+'%;background:'+s.cor+'" title="'+esc(s.nome)+': '+s.n+'"></div>').join('')+'</div>'+
    '<div class="stack-legend">'+segmentos.map(s=>
      '<button class="item" style="background:none;border:0;padding:0;cursor:pointer;text-align:left" onclick="filtrarPorSituacao(\''+s.key+'\')">'+
        '<span class="sw" style="background:'+s.cor+'"></span>'+
        '<span class="nm">'+esc(s.nome)+'</span>'+
        '<span class="qt">'+s.n+'</span>'+
        '<span class="pc">'+pct(s.n,total)+'%</span>'+
      '</button>').join('')+'</div>';

  const anelSaude =
    '<div class="gauge">'+
      '<div class="ring" style="background:conic-gradient(var(--green) 0 '+saude+'%, var(--slate-100) '+saude+'% 100%)"><span>'+saude+'%</span></div>'+
      '<div>'+
        '<div style="font-size:13.5px;color:var(--slate-600)">'+saudaveis+' de '+total+' licenças estão vigentes, sem bloqueio e fora da janela de expiração.</div>'+
        '<div class="mini-metric mt16"><span class="k">Vencendo em até 30 dias</span><span class="v">'+porSit.aexpirar.length+'</span></div>'+
        '<div class="mini-metric"><span class="k">Dentro da tolerância ('+TOLERANCIA_DIAS+' dias)</span><span class="v">'+porSit.tolerancia.length+'</span></div>'+
        '<div class="mini-metric"><span class="k">Expiradas ou bloqueadas</span><span class="v">'+(porSit.expirada.length+porSit.bloqueada.length)+'</span></div>'+
      '</div>'+
    '</div>';

  /* --- 11.3 licenças por tipo e por categoria --- */
  const porTipo = vivos('tiposLicenca').map(t=>({t:t.sigla, n:ls.filter(l=>l.tipoLicencaId===t.id).length})).filter(x=>x.n);
  const porCategoria = vivos('categorias').map(c=>({t:c.descricao, n:ls.filter(l=>l.categoriaId===c.id).length})).filter(x=>x.n);
  const maxTipo = Math.max(1,...porTipo.map(x=>x.n));
  const maxCat  = Math.max(1,...porCategoria.map(x=>x.n));
  const barras = (arr,max) => arr.map(x=>'<div class="bar-row"><div class="name">'+esc(x.t)+'</div>'+
    '<div class="bar-track"><div class="bar-fill" style="width:'+(x.n/max*100)+'%"></div></div><div class="qty">'+x.n+'</div></div>').join('');

  /* --- usuários licenciados --- */
  const comLimite = ls.filter(l=>!limiteUsuarios(l).ilimitado);
  const totalUsuarios = comLimite.reduce((s,l)=>s+limiteUsuarios(l).valor,0);
  const ilimitadas = ls.filter(l=>limiteUsuarios(l).ilimitado).length;
  const media = comLimite.length?Math.round(totalUsuarios/comLimite.length):0;
  const topUsuarios = comLimite.slice().sort((a,b)=>limiteUsuarios(b).valor-limiteUsuarios(a).valor).slice(0,5);
  const maxUso = topUsuarios.length?limiteUsuarios(topUsuarios[0]).valor:1;

  /* --- resumo da carteira --- */
  const resumo = [
    ['Clientes ativos', vivos('clientes').filter(c=>c.ativo).length],
    ['Parceiros comerciais', vivos('parceiros').filter(p=>p.ativo).length],
    ['Produtos ativos', vivos('produtos').filter(p=>p.ativo).length],
    ['Tipos de licença', vivos('tiposLicenca').filter(t=>t.ativo).length],
    ['Ambientes em uso', new Set(DB.instalacoes.map(i=>i.ambienteId)).size],
    ['Eventos no histórico', DB.auditoria.length]
  ];

  return pageHead('Dashboard','Visão executiva da carteira de licenças — '+fmtDate(hojeISO()),
      '<button class="btn btn-ghost" onclick="executarRotinas()">'+IC.bolt+'Executar rotinas</button>'+
      '<button class="btn btn-ghost" onclick="go(\'#/consultas\')">'+IC.chart+'Consultas</button>'+
      '<button class="btn btn-primary" onclick="go(\'#/licencas/nova\')">'+IC.plus+'Nova Licença</button>')+
    panorama+
    '<div class="two-col mb20">'+
      '<div class="card"><div class="card-head"><h2>Distribuição por situação</h2>'+
        '<span class="muted" style="font-size:12.5px">clique na legenda para filtrar a lista</span></div>'+
        '<div class="card-body">'+stack+'</div></div>'+
      '<div class="card"><div class="card-head"><h2>Saúde da carteira</h2></div><div class="card-body">'+anelSaude+'</div></div>'+
    '</div>'+
    '<div class="grid g3 mb20">'+
      '<div class="card"><div class="card-head"><h2>Licenças por tipo</h2></div><div class="card-body">'+
        (porTipo.length?barras(porTipo,maxTipo):'<p class="muted">Sem dados.</p>')+
        '<h3 class="section-title mt24">Por categoria</h3>'+
        (porCategoria.length?barras(porCategoria,maxCat):'<p class="muted">Sem dados.</p>')+
      '</div></div>'+
      '<div class="card"><div class="card-head"><h2>Usuários licenciados</h2></div><div class="card-body">'+
        '<div class="mini-metric"><span class="k">Total licenciado</span><span class="v">'+totalUsuarios+'</span></div>'+
        '<div class="mini-metric"><span class="k">Média por licença</span><span class="v">'+media+'</span></div>'+
        '<div class="mini-metric"><span class="k">Licenças ilimitadas</span><span class="v">'+ilimitadas+'</span></div>'+
        '<div class="mini-metric"><span class="k">Com liberação temporária</span><span class="v">'+ls.filter(l=>limiteUsuarios(l).liberado).length+'</span></div>'+
        '<h3 class="section-title mt24">Maiores alocações</h3>'+
        topUsuarios.map(l=>'<div style="margin-bottom:12px"><div class="between" style="font-size:12.5px">'+
          '<span class="linkcell" onclick="go(\'#/licencas/'+l.id+'\')">'+esc(clienteDe(l).nomeFantasia)+'</span>'+
          '<b style="color:var(--slate-900)">'+limiteUsuarios(l).valor+'</b></div>'+
          '<div class="barra-uso"><div style="width:'+(limiteUsuarios(l).valor/maxUso*100)+'%"></div></div></div>').join('')+
      '</div></div>'+
      '<div class="card"><div class="card-head"><h2>Resumo da carteira</h2></div><div class="card-body">'+
        resumo.map(r=>'<div class="mini-metric"><span class="k">'+esc(r[0])+'</span><span class="v">'+r[1]+'</span></div>').join('')+
        '<div class="alert alert-info mt20">'+IC.info+'<div>As rotinas automáticas expiram licenças vencidas, encerram instalações temporárias e restauram liberações.</div></div>'+
      '</div></div>'+
    '</div>'+
    '<div class="card"><div class="card-head"><h2>Licenças que exigem ação</h2>'+
      '<button class="btn btn-primary btn-sm" onclick="filtrarAtencao()">'+IC.filterOff+'Ver todas na lista</button></div>'+
      (atencao.length?'<div class="table-wrap"><table><thead><tr><th>Licença</th><th>Cliente</th><th>Tipo</th><th>Expira em</th><th>Situação</th><th>Motivo</th><th></th></tr></thead><tbody>'+
        atencao.slice(0,8).map(l=>{ const s=situacao(l), d=diasAte(l.expiracao);
          return '<tr><td class="strong"><span class="linkcell" onclick="go(\'#/licencas/'+l.id+'\')">'+esc(l.identificador)+'</span></td>'+
          '<td>'+esc(clienteDe(l).nomeFantasia)+'</td>'+
          '<td>'+badge(tipoLicDe(l).sigla,'b-ref')+'</td>'+
          '<td class="num">'+fmtDate(l.expiracao)+'<span class="cell-sub">'+(d<0?Math.abs(d)+' dia(s) atrás':'em '+d+' dia(s)')+'</span></td>'+
          '<td>'+badge(s.label,s.cls)+'</td>'+
          '<td>'+(l.motivoId?esc(get('motivos',l.motivoId).descricao):'<span class="muted">—</span>')+'</td>'+
          '<td class="right"><div class="rowactions">'+
            actCustom(IC.refresh,'Renovar','openRenovar('+l.id+')')+
            actCustom(IC.swap,'Alterar situação','openAlterarStatus('+l.id+')')+
            actView('#/licencas/'+l.id)+'</div></td></tr>'; }).join('')+
        '</tbody></table></div>'
      :'<div class="empty">'+IC.check+'<h3>Nenhuma licença exige ação</h3><p>Toda a carteira está vigente e dentro do prazo.</p></div>')+
    '</div>';
};
function filtrarPorSituacao(key){
  clearList('lic'); setListF('lic','sit',key); go('#/licencas');
}
function filtrarAtencao(){
  clearList('lic'); setListF('lic','sit','aexpirar'); go('#/licencas');
  toast('Filtro aplicado','Mostrando licenças a expirar. Troque o filtro Situação para ver expiradas ou bloqueadas.');
}

/* =========================================================
   Boot — 11.5: rota padrão é o Dashboard
   ========================================================= */
if(!location.hash) { try{ location.hash = '#/dashboard'; }catch(e){} }
S.route = location.hash || '#/dashboard';
render();

</script>
</body>
</html>
